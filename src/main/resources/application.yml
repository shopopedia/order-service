server:
  port: 8086

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: order_service
    password: order_service_pass
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always